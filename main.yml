name: Build Android APK (API 31)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-api31-u22-jdk17-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip wheel setuptools
          pip install cython==0.29.36 buildozer==1.6.0

      - name: Build Debug APK
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-tracker-s10-apk
          path: bin/*.apk
